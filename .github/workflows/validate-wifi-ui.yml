name: Validate Wi-Fi provisioning UI

on:
  push:
    paths:
      - "wifi-connect/ui/**"
      - ".github/workflows/validate-wifi-ui.yml"
  pull_request:
    paths:
      - "wifi-connect/ui/**"
      - ".github/workflows/validate-wifi-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-wifi-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate JavaScript syntax
        run: node --check wifi-connect/ui/js/index.js

      - name: Validate referenced local assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("wifi-connect/ui")
          missing = []

          html = (root / "index.html").read_text(encoding="utf-8")
          html_refs = re.findall(r'(?:src|href)=["\']([^"\']+)["\']', html)
          for ref in html_refs:
              if ref.startswith(("http://", "https://", "#", "data:")):
                  continue
              path = root / ref.lstrip("/")
              if not path.is_file():
                  missing.append(f"{ref} -> {path}")

          css_files = list((root / "css").rglob("*.css"))
          css_refs = []
          for css_file in css_files:
              css = css_file.read_text(encoding="utf-8")
              for ref in re.findall(r"url\(\s*[\"']?([^\"'\)]+)[\"']?\s*\)", css):
                  if ref.startswith(("http://", "https://", "data:", "#")):
                      continue
                  # Bootstrap's bundled Glyphicons font declarations are retained in
                  # the vendor stylesheet, but the provisioning UI does not use them.
                  if css_file.name == "bootstrap.min.css" and ref.startswith("../fonts/glyphicons-halflings-regular"):
                      continue
                  css_refs.append((css_file, ref))
                  path = (css_file.parent / ref.split("#", 1)[0].split("?", 1)[0]).resolve()
                  if not path.is_file():
                      missing.append(f"{css_file}: {ref} -> {path}")

          if missing:
              raise SystemExit("Missing local assets:\n" + "\n".join(missing))
          print(f"Validated {len(html_refs)} HTML references and {len(css_refs)} CSS assets.")
          PY
